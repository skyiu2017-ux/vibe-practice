<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중3 세계사 단원별 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="quiz-container">
    <header>
      <h1>📜 중3 세계사 수업 전 퀴즈</h1>
      <div id="progress">문제 <span id="current-num">1</span> / <span id="total-num">5</span></div>
    </header>

    <div id="quiz-box">
      <h2 id="question-text">문제가 여기에 표시됩니다.</h2>
      <div id="options-container" class="options-grid"></div>
      <div id="feedback" class="feedback-box hidden"></div>
      <button id="next-btn" class="btn hidden">다음 문제 ➔</button>
    </div>

    <div id="result-box" class="hidden">
      <h2>🎉 퀴즈 종료!</h2>
      <p id="score-text"></p>
      <button id="restart-btn" class="btn">다시 풀기 🔄</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
